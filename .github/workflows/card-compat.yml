name: Card compatibility

on:
  push:
    branches: [compat/card-1220]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card:
    name: Card browser and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Tamahome-M/evolute-card
          ref: 850c0709f4be3d62ee3895bcdb36102a8f85cc39
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install playwright==1.63.0
      - run: playwright install --with-deps chromium
      - run: python tests/test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-screenshots
          path: artifacts/
